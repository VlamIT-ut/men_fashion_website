<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- CSS của bạn -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* If needed you can add custom CSS fixes here */
  </style>
</head>

<body>
  <div class="login-wrapper">

    <div class="container" id="container">

      <!-- SIGN UP FORM -->
      <div class="form-container sign-up-container">
        <form action="signup.php" method="POST">
          <h1>Create Account</h1>
          <span>or use your email for registration</span>

          <input type="text" name="email" placeholder="Email" />
          <input type="text" name="fullName" placeholder="Full Name" />
          <input type="date" name="dateOfBirth" placeholder="Date of Birth" />

          <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>

          <input type="text" name="phoneNumber" placeholder="Phone Number" />
          <input type="text" name="address" placeholder="Address" />

          <input type="password" name="password" placeholder="Password" />
          <input type="password" name="confirmPassword" placeholder="Confirm Password" />

          <button type="submit">Sign Up</button>
        </form>
      </div>

      <!-- SIGN IN FORM -->
      <div class="form-container sign-in-container">
        <form action="login.php" method="POST">
          <h1>Sign in</h1>

          <div class="social-container">
            <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
            <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
          </div>

          <span>or use your account</span>

          <input type="email" name="email" placeholder="Email" />
          <input type="password" name="password" placeholder="Password" />

          <a href="#">Forgot your password?</a>
          <button type="submit">Sign In</button>
        </form>
      </div>

      <!-- OVERLAY PANEL -->
      <div class="overlay-container">
        <div class="overlay">

          <div class="overlay-panel overlay-left">
            <h1>Welcome Back!</h1>
            <p>To keep connected with us please login with your personal info</p>
            <button class="ghost" id="signInBtn">Sign In</button>
          </div>

          <div class="overlay-panel overlay-right">
            <h1>Hello, Friend!</h1>
            <p>Enter your personal details and start journey with us</p>
            <button class="ghost" id="signUpBtn">Sign Up</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Toggle animation JS (thay cho React state) -->
  <script>
    const container = document.getElementById("container");
    const signUpBtn = document.getElementById("signUpBtn");
    const signInBtn = document.getElementById("signInBtn");

    signUpBtn.onclick = () => container.classList.add("right-panel-active");
    signInBtn.onclick = () => container.classList.remove("right-panel-active");

    // Auto-open signUp if URL has #register
    if (window.location.hash === "#register") {
      container.classList.add("right-panel-active");
    }
  </script>

</body>
</html>
